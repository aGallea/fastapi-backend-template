[project]
name = "my-app"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.123.0",
    "pydantic-settings>=2.12.0",
    "uvicorn>=0.38.0",
]
[tool.uv]
dev-dependencies = [
    "mypy<2.4.0,>=2.3.1",
    "ruff<1.0.0,>=0.2.2",
    "pre-commit>=4.5.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
]

[tool.setuptools]
packages = ["my_app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true
exclude = ["venv", ".venv"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.pytest.ini_options]
addopts = "--cov=my_app --cov-report=xml:coverage/cobertura-coverage.xml --cov-report=html:coverage/html --cov-report=term --junitxml=coverage/junit.xml"
testpaths = ["tests"]

[tool.coverage.run]
source = ["my_app"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.yamlfix]
sequence_style = "block_style"
indent_mapping = 2
indent_sequence = 2
indent_offset = 0
line_length = 300
