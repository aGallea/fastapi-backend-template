---
docs:
- all:
  - changed-files:
    - any-glob-to-any-file:
      - '**/*.md'
    - all-globs-to-all-files:
      - '!tests/**'
      - '!my_app/**'
      - '!.github/**'
      - '!scripts/**'
      - '!.gitignore'
      - '!.pre-commit-config.yaml'
internal:
- all:
  - changed-files:
    - any-glob-to-any-file:
      - .github/**
      - scripts/**
      - .gitignore
      - .pre-commit-config.yaml
    - all-globs-to-all-files:
      - '!./**/*.md'
      - '!tests/**'
      - '!my_app/**'
