---
name: Tests
on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
      pull-requests: write
    steps:
    - uses: actions/checkout@v6
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Set up Python
      run: uv python install
    - name: Install the project
      run: uv sync --all-extras --dev
    - name: Run tests
      run: uv run pytest
    - name: Coverage Report
      if: always()
      uses: aGallea/tests-coverage-report@1.3.7
      with:
        min-coverage-percentage: '90'
        fail-under-coverage-percentage: 'false'
